include classpath("static.conf")

atlas {

  core {
    model {
      step = 10s
    }

    db {
      class = "com.netflix.atlas.core.db.MemoryDatabase"
      //class = "com.netflix.atlas.core.db.StaticDatabase"

      // How often to rebuild the index for the memory database
      rebuild-frequency = 8s

      // 1h with 10s step
      block-size = 360

      // 3h of data overall
      num-blocks = 3
    }
  }

  webapi {
    expr {
      debug {
        max-chunks-per-query = 5120
        max-steps = 20480
      }
    }
  }

  eval {
    graph {
      // Change default start time on graph to smaller range more typical for testing
      start-time = e-30m

      // Ensure default step time for rendering matches storage
      step = ${atlas.core.model.step}
    }
  }



  pekko {
    // Main server port
    port = 7101

    actors = ${?atlas.pekko.actors} [
      {
        name = "publish"
        class = "com.netflix.atlas.webapi.LocalPublishActor"
      }
    ]

    api-endpoints = ${?atlas.pekko.api-endpoints} [
      // Add debug endpoint for seeing the full config. Note, this can be risky if sensitive information
      // is in the config and the service is publicly available. Take steps to secure as needed.
      "com.netflix.atlas.pekko.ConfigApi",

      // Add publish endpoints to be able to receive data
      "com.netflix.atlas.webapi.PublishApi"
    ]
  }
}

// Raised from the default 4096 chars so the stresstest's stack-pinned
// ,:dup,:drop chain can drive N high enough to exercise the chunk cap
// (max-chunks-per-query) before hitting a URI-length limit instead.
pekko.http.parsing.max-uri-length = 65536

netflix.iep.atlas {
  enabled = true
  step = PT10S
}

atlas.lwcapi.startup-delay = 0s